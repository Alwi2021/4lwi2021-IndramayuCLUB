<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indramayu CLUB</title>
    <style>
        /* Add styles for smooth transitions and animations */
        .reaction {
            cursor: pointer;
            transition: transform 0.2s; 
        }
        .reaction:hover {
            transform: scale(1.2);
        }
        .comment-section {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Indramayu CLUB</h1>
    <!-- Existing Nur Upload functionality -->
    <div id="upload-section">
        <!-- Upload functionality here -->
    </div>

    <!-- Social Media Interaction Layer -->
    <div id="reactions">
        <span class="reaction" onclick="react('😂')">😂</span>
        <span class="reaction" onclick="react('❤️')">❤️</span>
        <span class="reaction" onclick="react('😍')">😍</span>
        <span class="reaction" onclick="react('😢')">😢</span>
        <span class="reaction" onclick="react('😡')">😡</span>
        <span class="reaction" onclick="react('👍')">👍</span>
    </div>
    <div id="like-counter">Likes: <span id="like-count">0</span></div>
    <div class="comment-section">
        <h2>Comments:</h2>
        <input type="text" id="comment-input" placeholder="Add a comment..." />
        <button onclick="addComment()">Post</button>
        <div id="comments-display"></div>
    </div>

    <script>
        let likeCount = 0;
        function react(emoji) {
            likeCount++;
            document.getElementById('like-count').innerText = likeCount;
            // Add animation for reaction (placeholder)
            alert('You reacted with: ' + emoji);
        }

        function addComment() {
            const commentInput = document.getElementById('comment-input');
            const commentDisplay = document.getElementById('comments-display');
            if(commentInput.value) {
                const commentDiv = document.createElement('div');
                commentDiv.innerText = commentInput.value;
                commentDisplay.appendChild(commentDiv);
                commentInput.value = ''; // Clear input
            }
        }
    </script>
</body>
</html>
