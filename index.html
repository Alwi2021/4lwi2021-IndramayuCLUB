<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Add necessary CSS for comment section and emoji reactions */
        .comment-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
        }
        .emoji {
            cursor: pointer;
            font-size: 20px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <h1>Comments</h1>
    <div id="comment-section">
        <div class="comment-box">
            <p>Sample Comment 1 <span class="emoji">😂</span><span class="emoji">❤️</span></p>
        </div>
        <div class="comment-box">
            <p>Sample Comment 2 <span class="emoji">😍</span><span class="emoji">😢</span></p>
        </div>
        <div class="comment-box">
            <p>Sample Comment 3 <span class="emoji">😡</span><span class="emoji">👍</span></p>
        </div>
    </div>
    <input type="text" id="new-comment" placeholder="Add a comment...">
    <button onclick="addComment()">Submit</button>
    <script>
        function addComment() {
            const commentInput = document.getElementById('new-comment');
            const newComment = commentInput.value;
            const commentSection = document.getElementById('comment-section');
            const commentBox = document.createElement('div');
            commentBox.className = 'comment-box';
            commentBox.innerHTML = `<p>${newComment} <span class='emoji'>😂</span><span class='emoji'>❤️</span></p>`;
            commentSection.appendChild(commentBox);
            commentInput.value = '';
        }
    </script>
</body>
</html>
