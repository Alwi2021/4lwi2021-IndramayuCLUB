<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { background: #000; color: #0f0; font-family: 'Courier New', monospace; text-align: center; font-size: 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; padding: 10px; }
    .nur-card { border: 1px solid #0f0; padding: 8px; border-radius: 4px; background: #080808; }
    .gold { border-color: #ffd700; color: #ffd700; }
    input { width: 85%; font-size: 9px; margin: 4px 0; background: #000; color: inherit; border: 1px solid #222; }
    button { width: 100%; cursor: pointer; background: #000; color: inherit; border: 1px solid; font-size: 10px; font-weight: bold; }
    button:hover { background: #0f0; color: #000; }
    #status-bar { color: yellow; margin-top: 15px; border-top: 1px solid #222; padding-top: 8px; font-weight: bold; }
  </style>
</head>
<body>
  <h3>PIRAMIDA GUARD v33 [STATUS: UP]</h3>
  <div class="grid" id="main-grid"></div>
  <div id="status-bar">Sistem Stabil - Hadir Pak dulKohar</div>

  <script>
    const config = {
      10: { n: "SATRIA 01", f: "1-vfSMe4HLBRw_6xgHQuzL2MaL-QsmYyT", c: "gold" },
      9:  { n: "NUR 9", f: "1D2jx-VV-AkPwc6rUtvabthyYc61Lw7Ti" },
      8:  { n: "NUR 8", f: "15pynM8x7bca0deCVLjW6BhyqW51QZ76s" },
      7:  { n: "NUR 7", f: "1AY5jD0Bb0ZMcUw2JTq5HpbNlZQ113P3n" },
      6:  { n: "NUR 6", f: "1Gt21jF-4N-e0ep5U_ZwjtYHqIjXSgvPa" },
      5:  { n: "NUR 5", f: "19sQU6y-_PD2Nj9-wRdsICh7LUyxtspia" },
      4:  { n: "NUR 4", f: "1w4NdVPZVbdptFT_n3mtL0zxPQ_Uveuz" },
      3:  { n: "NUR 3", f: "1v0Wc-oNUhJYHBIj9sP6KcmOXwNpHkzm_" },
      2:  { n: "NUR 2", f: "19ezgJgH4kn7KV23NMaLsUnJVH18PMJT_" },
      1:  { n: "NUR 1", f: "1-vfSMe4HLBRw_6xgHQuzL2MaL-QsmYyT" }
    };

    const grid = document.getElementById('main-grid');
    Object.keys(config).reverse().forEach(id => {
      grid.innerHTML += `
        <div class="nur-card ${config[id].c || ''}">
          <b>${config[id].n}</b><br>
          <input type="file" id="in${id}">
          <button onclick="post(${id})">POST ${id}.JPEG</button>
        </div>`;
    });

    function post(id) {
      const file = document.getElementById('in'+id).files[0];
      const bar = document.getElementById('status-bar');
      if(!file) return;
      bar.innerText = "⏳ Nur " + id + " Mengirim Data...";
      const reader = new FileReader();
      reader.onload = e => {
        google.script.run.withSuccessHandler(res => {
          bar.innerText = "✅ " + res;
        }).simpanFile(e.target.result, id, config[id].f);
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
